<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know God | Forge Faith</title>
<meta name="description" content="Five short screens on how to know God. Take five minutes, brother.">
<meta property="og:title" content="Know God | Forge Faith">
<meta property="og:description" content="Five short screens on how to know God. Take five minutes, brother.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.forgefaith.net/go/gospel/">
<meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/forge-by-faith-u1c1tx.firebasestorage.app/o/gospel_images%2FGospel%20-%20scene%201.png?alt=media&token=d75146ea-b9c8-40fa-bd54-4f65dd6b2289">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app" content="app-id=6781935591">
<meta name="theme-color" content="#050505">
<style>
:root{--bg:#050505;--gold:#E8B84A;--ember:#FF6A1A;--text:#F2EDE4;--muted:#A39C90}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(5,5,5,.92);backdrop-filter:blur(8px)}
.bars{flex:1;display:flex;gap:6px}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .4s}
.brand{font-weight:800;font-size:13px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.screen{display:none}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.screen img{display:block;width:100%;height:auto}
.txt{padding:24px}
.txt h1{font-size:30px;line-height:1.15;margin-bottom:18px}
.txt p{font-size:18px;line-height:1.5;margin-bottom:14px}
.verse{border-left:2px solid var(--gold);padding-left:14px;margin:0 0 14px}
.verse q{font-family:Georgia,serif;font-style:italic;font-size:16px;line-height:1.5;display:block}
.verse q::before,.verse q::after{content:'"'}
.verse span{color:var(--gold);font-size:13px;font-weight:700}
.actions{padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:var(--bg)}
.btn.gold:disabled{background:var(--ember);color:var(--text);cursor:default}
.btn.line{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.foot{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.app{margin:8px 16px 32px;padding:18px;border-radius:14px;border:1px solid rgba(232,184,74,.4);background:rgba(255,255,255,.04);text-align:center}
.app p{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:12px}
.msg{padding:48px 24px;text-align:center;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="bars" id="bars"></div><div class="brand">FORGE FAITH</div></div>
  <main id="screens"><p class="msg" id="loading">Loading…</p></main>
  <section id="finale" class="hide">
    <div class="actions">
      <button class="btn gold" id="prayed">I prayed this</button>
      <button class="btn line" id="share">Send this to someone</button>
    </div>
    <div class="app">
      <p>Want a daily devotion built for men? Get the Forge Faith app.</p>
      <a class="btn gold" href="https://apps.apple.com/app/id6781935591">Get the app</a>
    </div>
  </section>
  <div class="foot" id="foot"><button class="btn gold" id="next">Keep going</button></div>
</div>
<script>
(function(){
  var BASE='https://firestore.googleapis.com/v1/projects/forge-by-faith-u1c1tx/databases/(default)/documents/';
  var screens=[],idx=0,shareUrl='https://www.forgefaith.net/go/gospel/';
  function val(v){
    if(!v) return null;
    if('stringValue' in v) return v.stringValue;
    if('integerValue' in v) return Number(v.integerValue);
    if('doubleValue' in v) return v.doubleValue;
    if('booleanValue' in v) return v.booleanValue;
    if('nullValue' in v) return null;
    if('arrayValue' in v) return (v.arrayValue.values||[]).map(val);
    if('mapValue' in v){var o={},f=v.mapValue.fields||{};for(var k in f)o[k]=val(f[k]);return o;}
    return null;
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function textBlock(s){
    var d=el('div','txt');d.appendChild(el('h1',null,s.heading||''));
    (s.body||[]).forEach(function(p){d.appendChild(el('p',null,p));});
    (s.verses||[]).forEach(function(v){var b=el('div','verse');b.appendChild(el('q',null,v.text||''));b.appendChild(el('span',null,v.ref||''));d.appendChild(b);});
    if(s.prayer){d.appendChild(el('p',null,s.prayer_intro||''));var pv=el('div','verse');pv.appendChild(el('q',null,s.prayer));d.appendChild(pv);}
    return d;
  }
  function render(){
    var main=document.getElementById('screens');main.innerHTML='';
    var bars=document.getElementById('bars');bars.innerHTML='';
    screens.forEach(function(s,i){
      bars.appendChild(el('div','bar'));
      var sec=el('section','screen');
      if(s.image_url){
        var img=new Image();img.src=s.image_url;img.loading=i===0?'eager':'lazy';
        img.alt=(s.heading||'')+'. '+(s.body||[]).join(' ');
        img.onerror=function(){sec.innerHTML='';sec.appendChild(textBlock(s));};
        sec.appendChild(img);
      } else sec.appendChild(textBlock(s));
      main.appendChild(sec);
      if(s.share_url) shareUrl=s.share_url;
    });
    show(0);
  }
  function show(i){
    idx=i;
    var secs=document.querySelectorAll('.screen'),bars=document.querySelectorAll('.bar'),n=screens.length;
    secs.forEach(function(s,k){s.classList.toggle('on',k===i);});
    bars.forEach(function(b,k){
      var t=n>1?k/(n-1):1;
      b.style.background=k<=i?'rgb('+Math.round(232+(255-232)*t)+','+Math.round(184+(106-184)*t)+','+Math.round(74+(26-74)*t)+')':'';
    });
    var last=i>=n-1;
    document.getElementById('finale').classList.toggle('hide',!last);
    document.getElementById('foot').classList.toggle('hide',last);
    var cta=screens[i]&&screens[i].cta_next;document.getElementById('next').textContent=cta||'Keep going';
    window.scrollTo({top:0,behavior:'smooth'});
  }
  document.getElementById('next').onclick=function(){if(idx<screens.length-1)show(idx+1);};
  document.getElementById('prayed').onclick=function(){
    var b=this;if(b.disabled)return;b.disabled=true;
    var last=screens[screens.length-1]||{};b.textContent=last.cta_prayed_done||'He heard you';
    fetch(BASE+'decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{
      uid:{nullValue:null},source:{stringValue:'web'},screen:{stringValue:'gospel'},platform:{stringValue:'web'},
      created_at:{timestampValue:new Date().toISOString()}}})}).catch(function(){});
  };
  document.getElementById('share').onclick=function(){
    var text='Brother, take five minutes and read this.';
    if(navigator.share){navigator.share({title:'Know God',text:text,url:shareUrl}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+shareUrl).then(function(){alert('Link copied. Paste it to someone.');});}
    else prompt('Copy this link:',shareUrl);
  };
  fetch(BASE+'gospel').then(function(r){return r.json();}).then(function(j){
    screens=(j.documents||[]).map(function(d){var o={},f=d.fields||{};for(var k in f)o[k]=val(f[k]);return o;})
      .sort(function(a,b){return (a.order||0)-(b.order||0);});
    if(!screens.length) throw new Error('empty');
    render();
  }).catch(function(){
    document.getElementById('screens').innerHTML='<p class="msg">Couldn’t load right now. Check your connection and try again.</p>';
    document.getElementById('foot').classList.add('hide');
  });
})();
</script>
</body>
</html>
